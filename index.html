<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具集</title>
<style>
  body{margin:0;padding:40px 20px;background:#f2efe8;color:#2c2925;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:22px;margin-bottom:8px;}
  p.desc{opacity:.7;margin-top:0;margin-bottom:28px;}
  .card{display:block;background:#fff;border:1px solid #e3ddd0;border-radius:12px;
    padding:16px 18px;margin-bottom:14px;text-decoration:none;color:inherit;transition:box-shadow .15s;}
  .card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
  .card h2{font-size:16px;margin:0 0 4px;color:#eb641e;}
  .card p{font-size:13px;margin:0;opacity:.75;}
</style>
</head>
<body>
<div class="wrap">
  <h1>工具集</h1>
  <p class="desc">自製小工具收集頁，之後新增工具會陸續加在這裡。</p>

  <a class="card" href="./clinic-schedule/">
    <h2>診所班表編輯器</h2>
    <p>編輯每月門診／復健班表，即時預覽 A4 月曆，可直接列印或另存 PDF。</p>
  </a>

  <!-- 之後新增工具，複製一份上面的 <a class="card">…</a> 貼在這裡即可 -->
</div>
</body>
</html>
