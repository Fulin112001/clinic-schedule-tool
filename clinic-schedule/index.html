<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>用馨診所月營業時間設定</title>
<style>
:root{
  --primary-red:#eb370f; --primary-orange:#eb641e; --primary-brown:#be8264;
  --bg-light-card:#fffdf7; --bg-sand:#e1d7af; --text-dark:#37414b;
  --blue-clinic:#0088cc; --blue-pt:#2a3b8f;
  --app-bg:#f2efe8; --panel-bg:#ffffff; --panel-border:#e3ddd0; --ink:#2c2925;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --app-bg:#1c1a17; --panel-bg:#26231f; --panel-border:#3a352d; --ink:#efe9df;
}}
:root[data-theme="dark"]{ --app-bg:#1c1a17; --panel-bg:#26231f; --panel-border:#3a352d; --ink:#efe9df; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--app-bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Heiti TC","Noto Sans TC",sans-serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--panel-bg);border-bottom:1px solid var(--panel-border);}
.topbar h1{font-size:16px;margin:0;font-weight:700;}
.topbar button{background:var(--primary-orange);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
.topbar button:hover{background:var(--primary-red);}
.layout{display:flex;flex-direction:column;gap:0;}
.editor{padding:16px;background:var(--panel-bg);border-bottom:1px solid var(--panel-border);}
.editor fieldset{border:1px solid var(--panel-border);border-radius:10px;margin:0 0 14px;padding:12px 14px;}
.editor legend{font-weight:700;padding:0 6px;font-size:13px;color:var(--primary-brown);}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
.field label{font-size:12px;opacity:.75;}
.field input,.field select{padding:8px 10px;border-radius:7px;border:1px solid var(--panel-border);background:var(--app-bg);color:var(--ink);font-size:14px;}
.weekday-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;}
.holiday-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--panel-border);}
.holiday-row:last-child{border-bottom:none;}
.small-btn{border:1px solid var(--panel-border);background:var(--app-bg);color:var(--ink);border-radius:7px;padding:7px 10px;font-size:13px;cursor:pointer;}
.small-btn.danger{color:var(--primary-red);border-color:var(--primary-red);}
.add-btn{background:var(--primary-brown);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;}

.preview-wrap{padding:20px 12px 40px;overflow-x:auto;background:var(--app-bg);}
.scale-box{width:210mm;transform-origin:top left;margin:0 auto;}
/* ── 以下與原始貼上之班表 CSS 完全一致，未做改動 ── */
.a4-page {
  width: 210mm;
  height: 297mm;
  margin: 20px auto;
  background: linear-gradient(135deg, #be8264 0%, #aa7052 100%);
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
  box-sizing: border-box;
  padding: 12mm 12mm;
  position: relative;
  page-break-after: always;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
@media print {
  body { background: none; }
  .a4-page {
    margin: 0;
    box-shadow: none;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
.header-container { display: flex; justify-content: space-between; align-items: center; }
.logo-box { display: flex; align-items: center; margin-bottom: 22px; gap: 22px; }
.logo-img { height: 100px; width: auto; }
.clinic-name { font-size: 36px; font-weight: bold; color: #ffffff; white-space: nowrap; }
.title-box { text-align: right; }
.title-box h1 { margin: 0; font-size: 28px; color: #ffffff; line-height: 1.2; }
.subtitle { margin-top: 6px; font-size: 20px; color: #e0e0e0; }
.main-card {
  background-color: var(--bg-light-card);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.month-header {
  font-size: 14px; font-weight: bold; color: var(--primary-brown);
  margin-bottom: 10px; border-bottom: 2px solid var(--bg-sand); padding-bottom: 5px;
}
.calendar-grid { width: 100%; border-collapse: separate; border-spacing: 3px; margin-bottom: 10px; }
.calendar-grid th { background-color: #f4eee0; color: var(--text-dark); padding: 6px; font-size: 16px; border-radius: 4px; }
.calendar-grid td {
  background-color: #faf8f3; border: 1px solid #eae5d9; height: 52px;
  vertical-align: top; padding: 4px; border-radius: 6px; width: 14.28%;
}
.date-num { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 3px; }
.date-num-pass { font-size: 14px; color: #a89e9e; margin-bottom: 3px; }
.shift-pill {
  display: block; font-size: 13px; color: white; padding: 2px 0;
  border-radius: 4px; margin-bottom: 2px; text-align: center;
}
.bg-orange { background-color: var(--primary-orange); }
.bg-red { background-color: var(--primary-red); }
.bg-blue { background-color: var(--blue-clinic); }
.bg-darkblue { background-color: var(--blue-pt); }
.time-info-box {
  background-color: #fffae6; border: 1.5px solid #ebdcb9; border-radius: 10px;
  padding: 10px 14px; font-size: 14px; line-height: 1.6; color: var(--text-dark);
}
.time-info-line { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.dot-orange { width: 10px; height: 10px; background-color: var(--primary-orange); border-radius: 50%; display: inline-block; }
.dot-blue { width: 10px; height: 10px; background-color: var(--blue-clinic); border-radius: 50%; display: inline-block; }
.dot-darkblue { width: 10px; height: 10px; background-color: var(--blue-pt); border-radius: 50%; display: inline-block; }
.dot-red { width: 10px; height: 10px; background-color: var(--primary-red); border-radius: 50%; display: inline-block; }
.card-footer {
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed #dcd3c1;
  display: flex; justify-content: space-between; align-items: flex-end; font-size: 11px; color: #666;
}
/* ── 原始 CSS 結束 ── */

@media print{
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
  .topbar,.editor{display:none !important;}
  .preview-wrap{padding:0;overflow:visible;background:none;height:auto !important;}
  .scale-box{transform:none !important;width:auto;}
  @page{size:A4 portrait;margin:0;}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>用馨診所 班表編輯器</h1>
  <div style="display:flex;align-items:center;">
    <button id="exportBtn" onclick="window.print()">列印 / 另存為 PDF</button>
  </div>
</div>

<div class="layout">
  <div class="editor" id="editor">
    <fieldset>
      <legend>基本資訊</legend>
      <div class="row">
        <div class="field"><label>診所名稱</label><input id="clinicName" value="用馨診所"></div>
        <div class="field"><label>標題</label><input id="titleText" value="本月門診與復健時間"></div>
        <div class="field"><label>副標題</label><input id="subtitleText" value="Clinic Hours & Physical Therapy Hours"></div>
      </div>
      <div class="row">
        <div class="field"><label>年份</label><input id="year" type="number" value="2026"></div>
        <div class="field"><label>月份</label><input id="month" type="number" min="1" max="12" value="10"></div>
        <div class="field"><label>看診醫師</label><input id="doctorName" value="黃凱琳"></div>
      </div>
      <div class="row">
        <div class="field"><label>Logo 圖片網址（選填，留空使用內建的用馨診所 Logo）</label><input id="logoUrl" placeholder="https://.../img-normal.png"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>每週班表模式</legend>
      <div class="weekday-grid" id="weekdayGrid"></div>
    </fieldset>

    <fieldset>
      <legend>國定假日 / 特殊公告日</legend>
      <div id="holidayList"></div>
      <button class="add-btn" onclick="addHoliday()">+ 新增假日</button>
    </fieldset>

    <fieldset>
      <legend>時間說明</legend>
      <div class="row">
        <div class="field"><label>午診時間</label><input id="noonClinic" value="12:30 - 15:30"></div>
        <div class="field"><label>午診復健</label><input id="noonPT" value="12:00 - 16:00"></div>
        <div class="field"><label>午診最後掛號</label><input id="noonLast" value="15:10"></div>
      </div>
      <div class="row">
        <div class="field"><label>晚診時間</label><input id="eveClinic" value="17:00 - 20:00"></div>
        <div class="field"><label>晚診復健</label><input id="evePT" value="16:30 - 20:30"></div>
        <div class="field"><label>晚診最後掛號</label><input id="eveLast" value="19:40"></div>
      </div>
      <div class="row">
        <div class="field"><label>公休說明</label><input id="closedNote" value="國定假日、週三、週日休診"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>頁尾聯絡資訊</legend>
      <div class="row">
        <div class="field"><label>網站</label><input id="website" value="https://www.yongsingclinic.com/"></div>
        <div class="field"><label>地址</label><input id="address" value="台北市松山區八德路三段215號1,2F"></div>
        <div class="field"><label>Email</label><input id="email" value="yongsingclinic@yongsingclinic.com"></div>
      </div>
    </fieldset>
  </div>

  <div class="preview-wrap" id="previewWrap">
    <div class="scale-box" id="scaleBox">
      <div class="a4-page" id="a4page"></div>
    </div>
  </div>
</div>

<script>
const WEEKDAY_LABELS = ['週日','週一','週二','週三','週四','週五','週六'];
let weekdayPattern = ['closed','full','full','closed','full','full','half'];
let holidays = [
  {date:'2026-09-28', label:'教師節', color:'red'},
  {date:'2026-10-10', label:'雙十國慶日', color:'red'}
];

function buildWeekdayGrid(){
  const grid = document.getElementById('weekdayGrid');
  grid.innerHTML = WEEKDAY_LABELS.map((lbl,i)=>`
    <div class="field">
      <label>${lbl}</label>
      <select onchange="weekdayPattern[${i}]=this.value;render()">
        <option value="closed" ${weekdayPattern[i]==='closed'?'selected':''}>公休</option>
        <option value="full" ${weekdayPattern[i]==='full'?'selected':''}>整天(午+晚)</option>
        <option value="half" ${weekdayPattern[i]==='half'?'selected':''}>半天(僅午診)</option>
      </select>
    </div>`).join('');
}

function buildHolidayList(){
  const list = document.getElementById('holidayList');
  list.innerHTML = holidays.map((h,i)=>`
    <div class="holiday-row">
      <div class="field"><label>日期</label><input type="date" value="${h.date}" onchange="holidays[${i}].date=this.value;render()"></div>
      <div class="field"><label>標籤文字</label><input value="${h.label}" onchange="holidays[${i}].label=this.value;render()"></div>
      <button class="small-btn danger" onclick="holidays.splice(${i},1);buildHolidayList();render()">刪除</button>
    </div>`).join('');
}
function addHoliday(){
  holidays.push({date:'', label:'', color:'red'});
  buildHolidayList();
}

function pad(n){return n<10?'0'+n:''+n;}

const DEFAULT_LOGO_URL = "../logos/img-normal.png";
function defaultLogoDataUri(name){
  return DEFAULT_LOGO_URL;
}

function shiftPills(type, doctor){
  if(type==='closed') return '';
  const pt_am = '<span class="shift-pill bg-orange">復健 | 午</span>';
  const clinic_am = `<span class="shift-pill bg-orange">午診 | ${doctor}</span>`;
  const pt_pm = '<span class="shift-pill bg-darkblue">復健 | 晚</span>';
  const clinic_pm = `<span class="shift-pill bg-blue">晚診 | ${doctor}</span>`;
  if(type==='half') return pt_am+clinic_am;
  return pt_am+clinic_am+pt_pm+clinic_pm;
}

function render(){
  const clinicName=document.getElementById('clinicName').value;
  const titleText=document.getElementById('titleText').value;
  const subtitleText=document.getElementById('subtitleText').value;
  const year=parseInt(document.getElementById('year').value,10);
  const month=parseInt(document.getElementById('month').value,10);
  const doctor=document.getElementById('doctorName').value;

  const first=new Date(year,month-1,1);
  const startWeekday=first.getDay();
  const daysInMonth=new Date(year,month,0).getDate();
  const rows=Math.ceil((startWeekday+daysInMonth)/7);
  const totalCells=rows*7;

  const holidayMap={};
  holidays.forEach(h=>{ if(h.date) holidayMap[h.date]=h; });

  let cells='';
  for(let i=0;i<totalCells;i++){
    const d=new Date(year,month-1,1-startWeekday+i);
    const isCurrent = d.getMonth()===month-1;
    const dateStr = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const wd = d.getDay();
    const numClass = isCurrent ? 'date-num' : 'date-num-pass';
    const dayLabel = (isCurrent && d.getDate()===1) ? `${month}/1` : d.getDate();
    let body;
    if(holidayMap[dateStr]){
      body = `<span class="shift-pill bg-${holidayMap[dateStr].color||'red'}">${holidayMap[dateStr].label}</span>`;
    } else {
      body = shiftPills(weekdayPattern[wd], doctor);
    }
    cells += `<td><div class="${numClass}">${dayLabel}</div>${body}</td>`;
  }
  let rowsHtml='';
  for(let r=0;r<rows;r++){
    rowsHtml += '<tr>'+cells.slice(0,0)+'</tr>'; // placeholder, replaced below
  }
  // slice cells into rows of 7
  const cellArr = cells.match(/<td>[\s\S]*?<\/td>/g) || [];
  rowsHtml = '';
  for(let r=0;r<rows;r++){
    rowsHtml += '<tr>' + cellArr.slice(r*7,r*7+7).join('') + '</tr>';
  }

  const noonClinic=document.getElementById('noonClinic').value;
  const noonPT=document.getElementById('noonPT').value;
  const noonLast=document.getElementById('noonLast').value;
  const eveClinic=document.getElementById('eveClinic').value;
  const evePT=document.getElementById('evePT').value;
  const eveLast=document.getElementById('eveLast').value;
  const closedNote=document.getElementById('closedNote').value;
  const website=document.getElementById('website').value;
  const address=document.getElementById('address').value;
  const email=document.getElementById('email').value;
  const logoUrl=document.getElementById('logoUrl').value.trim() || defaultLogoDataUri(clinicName);

  document.getElementById('a4page').innerHTML = `
    <header class="header-container">
      <div class="logo-box">
        <img src="${logoUrl}" alt="${clinicName} Logo" class="logo-img">
        <span class="clinic-name">${clinicName}</span>
      </div>
      <div class="title-box">
        <h1>${titleText}</h1>
        <p class="subtitle">${subtitleText}</p>
      </div>
    </header>
    <div class="main-card">
      <div class="month-header">${year}年${month}月</div>
      <table class="calendar-grid">
        <thead><tr>${WEEKDAY_LABELS.map(w=>`<th>${w}</th>`).join('')}</tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="time-info-box">
        <div class="time-info-line"><span class="dot-orange"></span><b>午診時間 ${noonClinic}</b>｜<span class="dot-orange"></span><b>午診復健 ${noonPT}</b><i>(最後門診掛號、復健報到時間：${noonLast})</i></div>
        <div class="time-info-line"><span class="dot-blue"></span><b>晚診時間 ${eveClinic}</b>｜<span class="dot-darkblue"></span><b>晚診復健 ${evePT}</b><i>(最後門診掛號、復健報到時間：${eveLast})</i></div>
        <div class="time-info-line"><span class="dot-red"></span><b>註：${closedNote}</b></div>
      </div>
      <div class="card-footer">
        <div>🌐 ${website}　📍 ${address}　✉️ ${email}</div>
      </div>
    </div>`;
}

function fitPreview(){
  const wrap = document.getElementById('previewWrap');
  const box = document.getElementById('scaleBox');
  const pageWidthPx = 210 * 3.7795; // mm to px approx at 96dpi
  const available = wrap.clientWidth - 24;
  const scale = Math.min(1, available / pageWidthPx);
  box.style.transform = `scale(${scale})`;
  wrap.style.height = (297*3.7795*scale + 40) + 'px';
}

document.getElementById('editor').addEventListener('input', render);
buildWeekdayGrid();
buildHolidayList();
render();
window.addEventListener('resize', fitPreview);
window.addEventListener('load', fitPreview);
setTimeout(fitPreview, 50);

</script>
</body>
</html>
